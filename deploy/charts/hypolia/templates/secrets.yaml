{{- if not .Values.secrets.existingForwardingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hypolia.forwardingSecretName" . }}
  labels:
    {{- include "hypolia.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.secrets.devForwardingSecret | quote }}
{{- end }}
{{- if and (not .Values.secrets.existingOrchestratorTokenSecret) .Values.secrets.devOrchestratorToken }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hypolia.orchestratorTokenSecretName" . }}
  labels:
    {{- include "hypolia.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.secrets.devOrchestratorToken | quote }}
{{- end }}
{{- if and .Values.s3.enabled (not .Values.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hypolia.s3SecretName" . }}
  labels:
    {{- include "hypolia.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKeyId: {{ .Values.s3.devAccessKeyId | quote }}
  secretAccessKey: {{ .Values.s3.devSecretAccessKey | quote }}
{{- end }}
