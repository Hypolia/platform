global:
  imageRegistry: ghcr.io/hypolia
  imageTag: latest
  # true en staging et en prod : refuse un imageTag vide ou "latest".
  immutableTags: false
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

secrets:
  # En production, fournir les noms de Secrets existants (créés hors Git / ExternalSecrets)
  existingForwardingSecret: ""
  # Valeur utilisée uniquement si existingForwardingSecret est vide (dev / k3d)
  devForwardingSecret: "hypolia-dev-forwarding-secret"

  # Token que le plugin proxy Hypolia envoie à rspigot-proxy (clé "token").
  existingProxyPluginTokenSecret: ""
  devProxyPluginToken: "hypolia-dev-proxy-plugin-token"

  existingOrchestratorTokenSecret: ""
  devOrchestratorToken: ""

  existingFerrisKeySecret: ""

progression:
  # Secret de connexion Postgres créé par CloudNativePG (ex. hypolia-db-app).
  # Vide : progression en mémoire, perdue au redémarrage (dev / k3d uniquement).
  existingDatabaseSecret: ""
  databaseUriKey: uri

proxy:
  image:
    repository: proxy
    tag: ""
  onlineMode: true
  maxPlayers: 100
  motd: "§6§lHypolia §8• §dMini-Jeux & SheepWars"
  shutdownMessage: "§eLe proxy redémarre, reviens dans un instant."
  shutdownTimeoutSeconds: 10
  decideTimeoutMs: 1000
  logLevel: info
  service:
    type: LoadBalancer
    port: 25565
    nodePort: null
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: "4"
      memory: 256Mi

proxyPlugin:
  image:
    repository: proxy-plugin
    tag: ""
  logLevel: info
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

orchestrator:
  replicas: 1
  image:
    repository: orchestrator
    tag: ""
  port: 8080
  logLevel: info
  queue:
    minPlayers: 1
  sheepwars:
    # Nombre minimum de serveurs chauds (0 = scale-to-zero)
    minReplicas: 1
    # Nombre maximum k de serveurs SheepWars simultanés
    maxReplicas: 5
    # Serveurs en attente maintenus dès qu'il y a de la demande
    standbyServers: 1
    maxPlayers: 16
    idleTtlSecs: 180
    startingTimeoutSecs: 120
    transferTimeoutSecs: 15
    emptyGraceSecs: 30
    endingTimeoutSecs: 60
    heartbeatTimeoutSecs: 30
    # Serveurs SheepWars en objets SheepWarsServer (docs/specs/sheepwars-crd.md).
    # L'AppProject ArgoCD doit autoriser CustomResourceDefinition avant d'activer.
    crd:
      enabled: false
    reconcileIntervalMs: 1000
  towerwars:
    # Désactivé par défaut : aucun Pod, CRD ni variable TOWERWARS_* tant que false.
    # Ordre de déploiement (ADR 0011) : tous les clients (lobby, proxy) en version N, puis true.
    enabled: false
    minReplicas: 0
    maxReplicas: 3
    standbyServers: 1
    # Un match Duo compte jusqu'à 12 joueurs (6 équipes de 2), un match Solo jusqu'à 6.
    maxPlayers: 12
    # ignoré pour TowerWars (mode Solo ou Duo choisi au lobby, minimum 2 équipes)
    queueMinPlayers: 4
    mode: solo
    # Vide : carte intégrée du plugin (monde vide, construit au démarrage, ~22 s).
    # Sinon (avec s3.enabled) : nom d'une map précuite (bake-map.sh de hypolia/towerwars),
    # lue sous s3://<bucket>/towerwars/<map>/{world.zip,arena.json}. Le monde arrive déjà construit.
    map: ""
    idleTtlSecs: 180
    startingTimeoutSecs: 120
    emptyGraceSecs: 30
    endingTimeoutSecs: 60
    heartbeatTimeoutSecs: 30
    # Attente avant de lancer un match incomplet (au moins 2 équipes en file).
    gatherSecs: 20
    # Serveurs TowerWars en objets TowerWarsServer (docs/adr/0011).
    # L'AppProject ArgoCD doit autoriser CustomResourceDefinition avant d'activer.
    crd:
      enabled: false
  deacoudre:
    # Désactivé par défaut : aucun Pod, CRD ni variable DEACOUDRE_* tant que false.
    enabled: false
    minReplicas: 0
    maxReplicas: 3
    standbyServers: 1
    maxPlayers: 8
    queueMinPlayers: 2
    rounds: 4
    # Arène générée par le plugin au démarrage : aucune map S3.
    arenaPath: /data/arena.json
    idleTtlSecs: 180
    startingTimeoutSecs: 120
    emptyGraceSecs: 30
    endingTimeoutSecs: 60
    heartbeatTimeoutSecs: 30
    # Serveurs Dé à coudre en objets DeACoudreServer.
    # L'AppProject ArgoCD doit autoriser CustomResourceDefinition avant d'activer.
    crd:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

lobby:
  # 2 instances : une mise à jour draine une instance pendant que l'autre sert.
  replicas: 2
  # Temps laissé aux joueurs pour partir vers l'autre instance avant l'arrêt.
  drainTimeoutSecs: 60
  storage:
    # Secret CloudNativePG du lobby (ex. hypolia-lobby-db-app).
    # Vide : layout et sessions en fichiers, perdus au redémarrage (dev / k3d).
    existingDatabaseSecret: ""
    databaseUriKey: uri
  rspigotImage:
    repository: lobby-server
    tag: ""
  pluginImage:
    repository: lobby
    tag: ""
  port: 25565
  grpcPort: 25580
  maxPlayers: 100
  ferriskey:
    url: "https://auth.ferrislabs.fr"
    publicUrl: ""
    realm: "capitainerie"
    clientId: "minecraft"
    scope: "openid profile email roles"
  capitainerie:
    url: ""
    consoleUrl: ""
    resource: ""
    realm: ""
    clientId: ""
  resources:
    rspigot:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    plugin:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

sheepwars:
  rspigotImage:
    repository: sheepwars-server
    tag: ""
  port: 25565
  grpcPort: 25581
  # Filtre tracing du serveur rspigot. tick_profile en debug écrit chaque tick
  # au-dessus de 50 ms avec ses passes les plus lourdes, et un résumé tous les 100 ticks.
  logLevel: "info,rspigot_core::tick_profile=debug"
  resources:
    rspigot:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
  # Sidecar plugin SheepWars (hypolia-sheepwars)
  pluginSidecar:
    enabled: true
    image:
      repository: sheepwars
      tag: ""
    extraEnv: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  nodeSelector: {}
  tolerations: []

towerwars:
  rspigotImage:
    repository: towerwars-server
    tag: ""
  port: 25565
  grpcPort: 25582
  resources:
    rspigot:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
  pluginSidecar:
    enabled: true
    image:
      repository: towerwars
      tag: ""
    extraEnv: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  nodeSelector: {}
  tolerations: []

deacoudre:
  rspigotImage:
    repository: deacoudre-server
    tag: ""
  port: 25565
  grpcPort: 25582
  resources:
    rspigot:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
  pluginSidecar:
    enabled: true
    image:
      repository: deacoudre
      tag: ""
    extraEnv: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  nodeSelector: {}
  tolerations: []

# Stockage S3 des maps, une par dossier <jeu>/<map>/{world.zip,arena.json} :
# sheepwars/<map>/ (rotation entre toutes les maps) et towerwars/<map>/.
s3:
  enabled: false
  endpoint: ""
  bucket: "hypolia-maps"
  region: "us-east-1"
  pathStyle: true
  cacheTtlSecs: 30
  # Optionnel : forcer une map fixe (sinon rotation automatique parmi les maps S3)
  fixedMap: ""
  # En production, fournir un Secret existant contenant accessKeyId et secretAccessKey
  existingSecret: ""
  devAccessKeyId: ""
  devSecretAccessKey: ""

# Serveur S3 compatible local (uniquement pour dev / k3d)
rustfs:
  enabled: false
  image:
    repository: rustfs/rustfs
    tag: latest
  persistence:
    enabled: false
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
